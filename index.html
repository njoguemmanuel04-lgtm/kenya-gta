<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>KENYA GTA 3D - SAN ANDREAS</title>
<style>body{margin:0;overflow:hidden;background:#87CEEB;font-family:Arial Black} canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;background:linear-gradient(#000,transparent);padding:10px;color:#fff;display:flex;justify-content:space-between;z-index:10}
#joy{position:fixed;bottom:20px;left:20px;width:110px;height:110px;background:rgba(0,0,0,0.3);border-radius:50%;border:2px solid #fff;z-index:10}
#knob{position:absolute;width:50px;height:50px;background:#fff;border-radius:50%;left:30px;top:30px}
#btns{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:10}
.b{width:65px;height:65px;background:rgba(0,166,81,0.8);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;border:2px solid #fff}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud"><div>💰 KSh <span id="cash">336</span> | 🧍 <span id="pax">0</span>/14</div><div id="status">KWAME - ON FOOT</div></div>
<div id="joy"><div id="knob"></div></div>
<div id="btns"><div class="b" id="enter">E</div><div class="b" id="horn" style="background:#ff9800">📯</div></div>

<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x87CEEB); scene.fog=new THREE.Fog(0x87CEEB,50,300);
const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:false}); renderer.setSize(window.innerWidth,window.innerHeight); renderer.shadowMap.enabled=false; document.body.appendChild(renderer.domElement);

// Lights - San Andreas style
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const sun=new THREE.DirectionalLight(0xffffff,0.8); sun.position.set(50,100,50); scene.add(sun);

// Ground - Nairobi tarmac
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),new THREE.MeshLambertMaterial({color:0x333333})); ground.rotation.x=-Math.PI/2; scene.add(ground);
// Roads
const roadMat=new THREE.MeshLambertMaterial({color:0x222222});
const road1=new THREE.Mesh(new THREE.PlaneGeometry(1000,20),roadMat); road1.rotation.x=-Math.PI/2; road1.position.y=0.1; road1.position.z=0; scene.add(road1);
const road2=new THREE.Mesh(new THREE.PlaneGeometry(20,1000),roadMat); road2.rotation.x=-Math.PI/2; road2.position.y=0.1; road2.position.x=0; scene.add(road2);

// KICC TOWER - Nairobi landmark
const kicc=new THREE.Group();
const base=new THREE.Mesh(new THREE.CylinderGeometry(8,10,40,8),new THREE.MeshLambertMaterial({color:0xcccccc})); base.position.y=20; kicc.add(base);
const top=new THREE.Mesh(new THREE.CylinderGeometry(6,6,8,8),new THREE.MeshLambertMaterial({color:0xaaaaaa})); top.position.y=44; kicc.add(top);
kicc.position.set(0,0,-200); scene.add(kicc);

// Buildings - low poly San Andreas style
for(let i=0;i<40;i++){
  const h=10+Math.random()*30; const b=new THREE.Mesh(new THREE.BoxGeometry(15+Math.random()*15,h,15+Math.random()*15),new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(Math.random()*0.2+0.05,0.3,0.5)})); b.position.set((Math.random()-0.5)*400,h/2,(Math.random()-0.5)*400); if(b.position.length()<40) continue; scene.add(b);
}

// Player - Kwame - San Andreas CJ style
const playerGroup=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,0.6),new THREE.MeshLambertMaterial({color:0x111111})); body.position.y=1; playerGroup.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.5,8,8),new THREE.MeshLambertMaterial({color:0x8d5524})); head.position.y=2.1; playerGroup.add(head);
const backpack=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.9,0.3),new THREE.MeshLambertMaterial({color:0x222222})); backpack.position.set(0,1,-0.5); playerGroup.add(backpack);
playerGroup.position.set(0,0,10); scene.add(playerGroup);

// Matatus - 3D CGI colorful
let cars=[];
let colors=[0xffeb3b,0x00A651,0x2196F3,0xff5722];
for(let i=0;i<4;i++){
  const g=new THREE.Group();
  const chassis=new THREE.Mesh(new THREE.BoxGeometry(4,2,7),new THREE.MeshLambertMaterial({color:colors[i]})); chassis.position.y=1.2; g.add(chassis);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(3.8,0.2,6.5),new THREE.MeshLambertMaterial({color:0xffffff})); roof.position.y=2.3; g.add(roof);
  g.position.set((Math.random()-0.5)*80,0,(Math.random()-0.5)*80); g.rotation.y=Math.random()*Math.PI*2; g.userData={pax:0,speed:0}; scene.add(g); cars.push(g);
}

// Real People - 3D low poly pedestrians like San Andreas
let people=[];
for(let i=0;i<20;i++){
  const pg=new THREE.Group();
  const pb=new THREE.Mesh(new THREE.BoxGeometry(0.6,1,0.4),new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(Math.random(),0.7,0.5)})); pb.position.y=0.8; pg.add(pb);
  const ph=new THREE.Mesh(new THREE.SphereGeometry(0.3,6,6),new THREE.MeshLambertMaterial({color:0x8d5524})); ph.position.y=1.6; pg.add(ph);
  pg.position.set((Math.random()-0.5)*150,0,(Math.random()-0.5)*150); pg.userData={waiting:Math.random()>0.5,money:50+Math.random()*100,angle:Math.random()*6}; scene.add(pg); people.push(pg);
}

let keys={}; let inCar=false; let currentCar=null; let cash=336; let pax=0; let playerSpeed=0; let playerAngle=0;
let joyX=0,joyY=0;

function updateHUD(){ document.getElementById('cash').innerText=cash; document.getElementById('pax').innerText=pax; document.getElementById('status').innerText=inCar?`MATATU ${currentCar.children[0].material.color.getHexString()} - ${pax}/14`:'KWAME - ON FOOT'; }

camera.position.set(0,8,15); camera.lookAt(playerGroup.position);

function animate(){
  requestAnimationFrame(animate);
  // Player movement - San Andreas third person
  if(!inCar){
    let moveX=joyX; let moveY=joyY;
    if(keys['w']||keys['ArrowUp']) moveY=-1; if(keys['s']||keys['ArrowDown']) moveY=1; if(keys['a']||keys['ArrowLeft']) moveX=-1; if(keys['d']||keys['ArrowRight']) moveX=1;
    if(moveX||moveY){ playerAngle=Math.atan2(moveX,-moveY); playerGroup.rotation.y=playerAngle; playerGroup.position.x+=moveX*0.2; playerGroup.position.z+=moveY*0.2; }
    camera.position.x=playerGroup.position.x+Math.sin(playerGroup.rotation.y)*12; camera.position.z=playerGroup.position.z+Math.cos(playerGroup.rotation.y)*12; camera.position.y=playerGroup.position.y+6; camera.lookAt(playerGroup.position);
  } else {
    // Driving like San Andreas
    let accel=0; if(keys['w']||joyY<-0.3) accel=0.08; if(keys['s']||joyY>0.3) accel=-0.05; currentCar.userData.speed+=accel; currentCar.userData.speed*=0.97;
    currentCar.rotation.y+=joyX*0.05; if(keys['a']) currentCar.rotation.y+=0.05; if(keys['d']) currentCar.rotation.y-=0.05;
    currentCar.position.x+=Math.sin(currentCar.rotation.y)*currentCar.userData.speed; currentCar.position.z+=Math.cos(currentCar.rotation.y)*currentCar.userData.speed;
    playerGroup.position.copy(currentCar.position); playerGroup.position.y=0; playerGroup.visible=false;
    camera.position.x=currentCar.position.x+Math.sin(currentCar.rotation.y)* -15; camera.position.z=currentCar.position.z+Math.cos(currentCar.rotation.y)* -15; camera.position.y=8; camera.lookAt(currentCar.position);
    // pickup people - real CGI interaction
    people.forEach(p=>{ if(p.userData.waiting){ let d=p.position.distanceTo(currentCar.position); if(d<6 && pax<14){ p.userData.waiting=false; p.visible=false; pax++; cash+=Math.floor(p.userData.money); updateHUD(); if(navigator.vibrate) navigator.vibrate(50);} } });
  }
  // pedestrians wander
  people.forEach(p=>{ if(!p.userData.waiting){ p.position.x+=Math.sin(p.userData.angle)*0.02; p.position.z+=Math.cos(p.userData.angle)*0.02; if(Math.random()<0.01) p.userData.angle=Math.random()*6; }});
  renderer.render(scene,camera);
}
animate();

window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true); window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.getElementById('enter').onclick=()=>{
  if(inCar){ inCar=false; playerGroup.visible=true; playerGroup.position.x=currentCar.position.x+3; playerGroup.position.z=currentCar.position.z; currentCar=null; pax=0; updateHUD(); return; }
  let closest=null; let md=8; cars.forEach(c=>{ let d=c.position.distanceTo(playerGroup.position); if(d<md){md=d; closest=c;} }); if(closest){ inCar=true; currentCar=closest; }
};
// Joystick - San Andreas mobile style
const joy=document.getElementById('joy'); const knob=document.getElementById('knob');
joy.addEventListener('touchmove',e=>{ const r=joy.getBoundingClientRect(); const x=e.touches[0].clientX-r.left-55; const y=e.touches[0].clientY-r.top-55; const d=Math.sqrt(x*x+y*y); const max=40; let nx=x,ny=y; if(d>max){ nx=x/d*max; ny=y/d*max; } knob.style.left=30+nx+'px'; knob.style.top=30+ny+'px'; joyX=nx/max; joyY=ny/max; });
joy.addEventListener('touchend',()=>{ knob.style.left='30px'; knob.style.top='30px'; joyX=0; joyY=0; });
updateHUD();
</script>
</body>
</html>
