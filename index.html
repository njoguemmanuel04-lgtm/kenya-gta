<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KENYA GTA V5 - REALISTIC PHONE</title>
<style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:8px 12px;background:linear-gradient(rgba(0,0,0,0.8),transparent);color:#fff;font-family:Arial Black;font-size:12px;display:flex;justify-content:space-between;z-index:99}
#joy{position:fixed;bottom:25px;left:25px;width:110px;height:110px;border:2px solid rgba(255,255,255,0.6);border-radius:50%;z-index:99}
#knob{position:absolute;width:48px;height:48px;background:#fff;border-radius:50%;left:31px;top:31px}
#btn{position:fixed;bottom:25px;right:25px;width:75px;height:75px;background:#00A651;border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;z-index:99}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="hud"><div>💰 KSh <span id="cash">336</span> | REAL NAIROBI</div><div id="stat">KWAME</div></div>
<div id="joy"><div id="knob"></div></div><div id="btn">E</div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x87CEEB); scene.fog=new THREE.Fog(0x87CEEB,40,220);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; document.body.appendChild(renderer.domElement);

// LIGHT - makes it realistic
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,0.8));
const sun=new THREE.DirectionalLight(0xffffff,1); sun.position.set(30,50,20); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); scene.add(sun);

// GROUND with road markings - not black anymore
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshStandardMaterial({color:0x2b2b2b})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(600,14),new THREE.MeshStandardMaterial({color:0x1a1a1a})); road.rotation.x=-Math.PI/2; road.position.y=0.02; scene.add(road);
for(let i=-250;i<250;i+=20){ const line=new THREE.Mesh(new THREE.PlaneGeometry(6,0.5),new THREE.MeshBasicMaterial({color:0xffffff})); line.rotation.x=-Math.PI/2; line.position.set(i,0.03,0); scene.add(line); }

// KICC - makes it Nairobi real
const kiccGroup=new THREE.Group();
const kiccBody=new THREE.Mesh(new THREE.CylinderGeometry(4,6,30,12),new THREE.MeshStandardMaterial({color:0xc0c0c0,roughness:0.4})); kiccBody.position.y=15; kiccBody.castShadow=true; kiccGroup.add(kiccBody);
kiccGroup.position.set(-40,0,-120); scene.add(kiccGroup);

// BUILDINGS with windows - not grey boxes
for(let i=0;i<30;i++){
  const h=8+Math.random()*28; const b=new THREE.Mesh(new THREE.BoxGeometry(10+Math.random()*10,h,10+Math.random()*10),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.08+Math.random()*0.1,0.2,0.5)})); 
  b.position.set((Math.random()-0.5)*300,h/2,(Math.random()-0.5)*300); if(b.position.length()<35) continue; b.castShadow=true; b.receiveShadow=true; scene.add(b);
  // windows lights
  if(Math.random()>0.5){ const win=new THREE.Mesh(new THREE.BoxGeometry(8,1,8.1),new THREE.MeshBasicMaterial({color:0xffffaa})); win.position.set(b.position.x,h*0.7,b.position.z); scene.add(win); }
}

// REALISTIC MATATU - with body + windows + 4 wheels + lights
function makeMatatu(x,z,col){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(3.2,1.8,5.5),new THREE.MeshStandardMaterial({color:col,roughness:0.3,metalness:0.2})); body.position.y=1.3; body.castShadow=true; g.add(body);
  const top=new THREE.Mesh(new THREE.BoxGeometry(3,0.6,3.5),new THREE.MeshStandardMaterial({color:0x111111})); top.position.y=2.5; g.add(top);
  const glass=new THREE.Mesh(new THREE.BoxGeometry(3.1,0.5,3.6),new THREE.MeshStandardMaterial({color:0x000000,transparent:true,opacity:0.7})); glass.position.y=2.5; g.add(glass);
  // 4 wheels
  const wGeo=new THREE.CylinderGeometry(0.5,0.5,0.35,14); const wMat=new THREE.MeshStandardMaterial({color:0x111111});
  [[-1.6,0.5,-1.8],[1.6,0.5,-1.8],[-1.6,0.5,1.8],[1.6,0.5,1.8]].forEach(p=>{ const w=new THREE.Mesh(wGeo,wMat); w.rotation.z=Math.PI/2; w.position.set(p[0],p[1],p[2]); w.castShadow=true; g.add(w); });
  // headlights
  const light=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.2,0.1),new THREE.MeshStandardMaterial({color:0xffffcc,emissive:0xffffaa,emissiveIntensity:0.8})); light.position.set(-0.8,1,2.8); g.add(light); const light2=light.clone(); light2.position.x=0.8; g.add(light2);
  g.position.set(x,0,z); g.rotation.y=Math.random()*Math.PI; scene.add(g); return g;
}
const cars=[makeMatatu(8,2,0xffd600),makeMatatu(-10,12,0x00c853),makeMatatu(15,-8,0x2962ff)];

// REALISTIC KWAME - head + body + legs + backpack + cap
const kwame=new THREE.Group();
const headM=new THREE.MeshStandardMaterial({color:0x8d5524}); const head=new THREE.Mesh(new THREE.SphereGeometry(0.42,16,16),headM); head.position.y=1.75; head.castShadow=true; kwame.add(head);
const cap=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.15,0.6),new THREE.MeshStandardMaterial({color:0x111111})); cap.position.set(0,2.05,0.15); kwame.add(cap);
const torso=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.9,0.45),new THREE.MeshStandardMaterial({color:0x0a0a0a})); torso.position.y=1.1; torso.castShadow=true; kwame.add(torso);
const backpack=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.7,0.25),new THREE.MeshStandardMaterial({color:0x222222})); backpack.position.set(0,1.1,-0.35); kwame.add(backpack);
const legGeo=new THREE.BoxGeometry(0.28,0.9,0.3); const legMat=new THREE.MeshStandardMaterial({color:0x1e1e1e});
const lLeg=new THREE.Mesh(legGeo,legMat); lLeg.position.set(-0.18,0.2,0); lLeg.castShadow=true; kwame.add(lLeg);
const rLeg=lLeg.clone(); rLeg.position.x=0.18; kwame.add(rLeg);
kwame.position.set(0,0,6); scene.add(kwame);

let keys={}, joyX=0, joyY=0, inCar=false, curCar=null;
camera.position.set(0,4,10);
function animate(){
  requestAnimationFrame(animate);
  if(!inCar){
    let mx=joyX, my=joyY; if(keys['w']) my=-1; if(keys['s']) my=1; if(keys['a']) mx=-1; if(keys['d']) mx=1;
    if(mx||my){ const ang=Math.atan2(mx,-my); kwame.rotation.y=ang; kwame.position.x+=mx*0.12; kwame.position.z+=my*0.12; // walk animation
      const t=Date.now()*0.015; lLeg.rotation.x=Math.sin(t)*0.5; rLeg.rotation.x=-Math.sin(t)*0.5;
    }
  } else if(curCar){
    let acc=0; if(keys['w']||joyY<-0.2) acc=0.06; if(keys['s']||joyY>0.2) acc=-0.04; curCar.userData.speed=(curCar.userData.speed||0)+acc; curCar.userData.speed*=0.98;
    curCar.rotation.y+=joyX*0.04; if(keys['a']) curCar.rotation.y+=0.04; if(keys['d']) curCar.rotation.y-=0.04;
    curCar.position.x+=Math.sin(curCar.rotation.y)*curCar.userData.speed; curCar.position.z+=Math.cos(curCar.rotation.y)*curCar.userData.speed;
    kwame.position.copy(curCar.position); kwame.visible=false;
  }
  // camera follow like San Andreas
  const target=inCar?curCar.position:kwame.position;
  if(target){ camera.position.x+=(target.x-camera.position.x)*0.08; camera.position.z+=(target.z+10-camera.position.z)*0.08; camera.position.y=4.5; camera.lookAt(target.x,target.y+1,target.z); }
  renderer.render(scene,camera);
}
animate();

// controls
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true); window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.getElementById('btn').onclick=()=>{
  if(inCar){ inCar=false; kwame.visible=true; kwame.position.x=curCar.position.x+2; curCar=null; return; }
  let close=null,d=6; cars.forEach(c=>{ const dist=c.position.distanceTo(kwame.position); if(dist<d){d=dist; close=c;} }); if(close){ inCar=true; curCar=close; }
};
// joystick
const joy=document.getElementById('joy'), knob=document.getElementById('knob');
function handleJoy(e){ const r=joy.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left-55; const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top-55; const len=Math.sqrt(x*x+y*y); const max=42; let nx=x,ny=y; if(len>max){ nx=x/len*max; ny=y/len*max; } knob.style.left=31+nx+'px'; knob.style.top=31+ny+'px'; joyX=nx/max; joyY=ny/max; }
joy.addEventListener('touchmove',e=>{e.preventDefault(); handleJoy(e);}); joy.addEventListener('touchend',()=>{ knob.style.left='31px'; knob.style.top='31px'; joyX=0; joyY=0; });
joy.addEventListener('mousedown',e=>{ const move=ev=>handleJoy(ev); const up=()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); knob.style.left='31px'; knob.style.top='31px'; joyX=0; joyY=0; }; document.addEventListener('mousemove',move); document.addEventListener('mouseup',up); });
</script>
</body>
</html>
