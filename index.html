<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KENYA GTA V10 - PAYBACK EDITION</title>
<style>
body{margin:0;background:#111;overflow:hidden;font-family:Arial Black} canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:0;left:0;right:0;background:linear-gradient(#000,#0000);padding:8px 10px;color:#fff;display:flex;justify-content:space-between;font-size:12px;z-index:10}
#mission{position:fixed;top:40px;left:10px;right:10px;background:rgba(255,204,0,0.9);color:#000;padding:8px;border-radius:8px;font-size:12px;z-index:10;text-align:center}
#controls{position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;z-index:10}
#joy{width:110px;height:110px;border:2px solid rgba(255,255,255,0.7);border-radius:50%;position:relative}
#knob{width:46px;height:46px;background:#fff;border-radius:50%;position:absolute;left:32px;top:32px}
.btn{width:58px;height:58px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;margin:5px}
</style>
</head>
<body>
<div id="hud"><div>💰 KSh <span id="cash">336</span> | ❤️ <span id="hp">100</span> | ⭐ <span id="wanted">0</span></div><div>📍 NYALI BEACH</div></div>
<div id="mission">🎯 PAYBACK MISSION 1: Steal the Ferrari from beach boys and deliver to Koinange! Press E near car</div>
<canvas id="game"></canvas>
<div id="controls">
<div id="joy"><div id="knob"></div></div>
<div style="display:flex;flex-direction:column">
<div style="display:flex"><div class="btn" id="enter" style="background:#00A651">E</div><div class="btn" id="shoot" style="background:#cc0000">🔫</div></div>
<div style="display:flex"><div class="btn" id="brake" style="background:#ff9800">B</div><div class="btn" id="horn" style="background:#2196F3">📯</div></div>
</div>
</div>
<script>
const canvas=document.getElementById('game'); const ctx=canvas.getContext('2d');
function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; } resize(); onresize=resize;

let cash=336, hp=100, wanted=0;
let player={x:500,y:500,angle:0,speed:0,inCar:false,car:null,hasGun:true};

// PAYBACK STYLE MAP - Mombasa roads
const buildings=[]; for(let i=0;i<35;i++) buildings.push({x:Math.random()*2000,y:Math.random()*2000,w:90+Math.random()*100,h:90+Math.random()*100});
const roads=[{x:0,y:450,w:2000,h:24},{x:600,y:0,w:24,h:2000},{x:0,y:900,w:2000,h:20},{x:1200,y:0,w:20,h:2000}];

// CARS - Payback style sprites - Ferrari, Audi TTS, Benz, Matatu, Police
const cars=[
{x:560,y:520,w:36,h:18,color:'#cc0000',type:'Ferrari F8',speed:0,angle:-0.5,topSpeed:8,plate:'KCF 007F'},
{x:650,y:600,w:32,h:16,color:'#eeeeee',type:'Audi TTS',speed:0,angle:0.2,topSpeed:6.5,plate:'KDA 47X'},
{x:700,y:480,w:38,h:18,color:'#111111',type:'Benz Conv',speed:0,angle:1,topSpeed:7,plate:'KCB 001M'},
{x:400,y:700,w:44,h:20,color:'#ffeb3b',type:'Matatu',speed:0,angle:0,topSpeed:4.5,plate:'KDA 33N'},
{x:800,y:800,w:36,h:18,color:'#ffffff',type:'Police',speed:0,angle:0,topSpeed:6,plate:'GKA 001P'}
];

let people=[]; for(let i=0;i<25;i++) people.push({x:Math.random()*2000,y:Math.random()*2000,angle:Math.random()*6,speed:0.3+Math.random()*0.6,color:`hsl(${Math.random()*60+10},70%,50%)`,type:Math.random()>0.5?'beach':'walk'});

let bullets=[]; let keys={}; let joyX=0, joyY=0;

function drawCar(c,isPlayer){
  ctx.save(); ctx.translate(c.x-player.x+canvas.width/2,c.y-player.y+canvas.height/2); ctx.rotate(c.angle);
  // body with shading - Payback style
  ctx.fillStyle=c.color; ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(-c.w/2+2,-c.h/2+2,c.w-4,c.h-8);
  // windshield
  ctx.fillStyle='#87CEEB'; ctx.fillRect(-c.w/4,-c.h/2+2,c.w/2,4);
  // headlights
  ctx.fillStyle='#ffffaa'; ctx.fillRect(c.w/2-3,-c.h/2+2,3,3); ctx.fillRect(c.w/2-3,c.h/2-5,3,3);
  // brake lights
  ctx.fillStyle='#ff0000'; ctx.fillRect(-c.w/2,-c.h/2+2,2,3); ctx.fillRect(-c.w/2,c.h/2-5,2,3);
  if(isPlayer){ ctx.strokeStyle='#00ff00'; ctx.lineWidth=2; ctx.strokeRect(-c.w/2-2,-c.h/2-2,c.w+4,c.h+4); }
  ctx.restore();
  // plate
  ctx.fillStyle='#fff'; ctx.font='8px Arial'; ctx.fillText(c.plate,c.x-player.x+canvas.width/2-18,c.y-player.y+canvas.height/2+22);
}

function draw(){
  ctx.fillStyle='#c2b280'; ctx.fillRect(0,0,canvas.width,canvas.height); // sand
  ctx.fillStyle='#0a7abf'; ctx.fillRect(-player.x+canvas.width/2,-player.y+canvas.height/2-200,2000,400); // ocean top
  // roads
  ctx.fillStyle='#1a1a1a'; roads.forEach(r=>{ ctx.fillRect(r.x-player.x+canvas.width/2,r.y-player.y+canvas.height/2,r.w,r.h); });
  // center line
  ctx.fillStyle='#ffcc00'; for(let i=0;i<2000;i+=30){ ctx.fillRect(i-player.x+canvas.width/2,450-player.y+canvas.height/2,12,2); }
  // buildings
  ctx.fillStyle='#2a2a2a'; buildings.forEach(b=>{ ctx.fillRect(b.x-player.x+canvas.width/2,b.y-player.y+canvas.height/2,b.w,b.h); ctx.fillStyle='#333'; ctx.fillRect(b.x-player.x+canvas.width/2+5,b.y-player.y+canvas.height/2+5,b.w-10,b.h-10); ctx.fillStyle='#2a2a2a'; });
  // people - Payback style dots with direction
  people.forEach(p=>{
    const sx=p.x-player.x+canvas.width/2, sy=p.y-player.y+canvas.height/2;
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(sx,sy,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.fillRect(sx-2,sy-2,4,4);
  });
  // cars
  cars.forEach(c=> drawCar(c, player.inCar && player.car===c));
  // player on foot
  if(!player.inCar){
    ctx.save(); ctx.translate(canvas.width/2,canvas.height/2); ctx.rotate(player.angle);
    ctx.fillStyle='#111'; ctx.fillRect(-6,-8,12,16);
    ctx.fillStyle='#8d5524'; ctx.beginPath(); ctx.arc(0,-10,6,0,Math.PI*2); ctx.fill();
    if(player.hasGun){ ctx.fillStyle='#444'; ctx.fillRect(6,-2,10,2); }
    ctx.restore();
  }
  // bullets
  ctx.fillStyle='#ffff00'; bullets.forEach(b=>{ ctx.beginPath(); ctx.arc(b.x-player.x+canvas.width/2,b.y-player.y+canvas.height/2,3,0,Math.PI*2); ctx.fill(); });
}

function update(){
  if(!player.inCar){
    let mx=joyX, my=joyY;
    if(keys['w']||keys['ArrowUp']) my=-1; if(keys['s']||keys['ArrowDown']) my=1; if(keys['a']||keys['ArrowLeft']) mx=-1; if(keys['d']||keys['ArrowRight']) mx=1;
    if(mx||my){ player.angle=Math.atan2(my,mx); player.x+=mx*3; player.y+=my*3; }
  } else {
    const c=player.car;
    let accel=0; if(keys['w']||joyY<-0.2) accel=0.18; if(keys['s']||joyY>0.2) accel=-0.12;
    c.speed+=accel; c.speed*=0.97; c.speed=Math.max(-c.topSpeed/2,Math.min(c.topSpeed,c.speed));
    if(Math.abs(c.speed)>0.5){
      let turn=joyX*0.06; if(keys['a']) turn=-0.06; if(keys['d']) turn=0.06;
      c.angle+=turn*(c.speed/c.topSpeed);
    }
    c.x+=Math.cos(c.angle)*c.speed; c.y+=Math.sin(c.angle)*c.speed;
    player.x=c.x; player.y=c.y;
    // police chase if wanted
    if(wanted>0){ cars.filter(x=>x.type==='Police').forEach(p=>{ const ang=Math.atan2(c.y-p.y,c.x-p.x); p.angle+=(ang-p.angle)*0.05; p.speed+=0.05; p.speed=Math.min(p.topSpeed,p.speed); p.x+=Math.cos(p.angle)*p.speed; p.y+=Math.sin(p.angle)*p.speed; if(Math.hypot(p.x-c.x,p.y-c.y)<40){ hp-=0.3; document.getElementById('hp').innerText=Math.floor(hp); if(hp<=0) location.reload(); } }); }
  }
  people.forEach(p=>{ p.x+=Math.cos(p.angle)*p.speed; p.y+=Math.sin(p.angle)*p.speed; if(Math.random()<0.02) p.angle+= (Math.random()-0.5); });
  bullets.forEach(b=>{ b.x+=Math.cos(b.angle)*8; b.y+=Math.sin(b.angle)*8; b.life--; });
  bullets=bullets.filter(b=>b.life>0);
}

function enterCar(){
  if(player.inCar){ player.inCar=false; player.car.speed=0; player.car=null; return; }
  let close=null,md=50; cars.forEach(c=>{ const d=Math.hypot(c.x-player.x,c.y-player.y); if(d<md){md=d; close=c;} });
  if(close){ player.inCar=true; player.car=close; if(close.type==='Ferrari F8'){ cash+=5000; document.getElementById('cash').innerText=cash; document.getElementById('mission').innerHTML='✅ Ferrari stolen! Now deliver to CBD without police! ⭐ Wanted +1'; wanted=1; document.getElementById('wanted').innerText=wanted; } }
}

function shoot(){
  if(player.hasGun){
    const ang=player.inCar?player.car.angle:player.angle;
    const sx=player.inCar?player.car.x:player.x, sy=player.inCar?player.car.y:player.y;
    bullets.push({x:sx+Math.cos(ang)*20,y:sy+Math.sin(ang)*20,angle:ang,life:40});
    wanted=Math.min(3,wanted+1); document.getElementById('wanted').innerText=wanted;
  }
}

function loop(){ draw(); update(); requestAnimationFrame(loop); }
loop();
window.addEventListener('keydown',e=>{ keys[e.key]=true; if(e.key==='e') enterCar(); if(e.key===' ') shoot(); });
window.addEventListener('keyup',e=>keys[e.key]=false);
document.getElementById('enter').onclick=enterCar;
document.getElementById('shoot').onclick=shoot;
document.getElementById('brake').onclick=()=>{ if(player.inCar) player.car.speed*=0.5; };
// joystick
const joy=document.getElementById('joy'), knob=document.getElementById('knob');
function handle(e){ const r=joy.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left-55; const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top-55; const l=Math.sqrt(x*x+y*y); let nx=x,ny=y; if(l>42){ nx=x/l*42; ny=y/l*42; } knob.style.left=32+nx+'px'; knob.style.top=32+ny+'px'; joyX=nx/42; joyY=ny/42; }
joy.addEventListener('touchmove',e=>{e.preventDefault(); handle(e);}); joy.addEventListener('touchend',()=>{ knob.style.left='32px'; knob.style.top='32px'; joyX=0; joyY=0; });
</script>
</body>
</html>
